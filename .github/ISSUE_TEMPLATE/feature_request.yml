name: Feature request
description: Suggest a workflow, record or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The product scope is in docs/product.md. Requests that fit a commercial US water,
        wastewater or soil laboratory are the easiest to act on. Use synthetic examples only.
  - type: textarea
    id: problem
    attributes:
      label: The laboratory problem
      description: Who needs this, in which step of their work, and what goes wrong today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you expect. Screens or records it touches, if you know.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Rules or sources
      description: If this follows a regulation, method or public format, link the primary source and its date.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this
