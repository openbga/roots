[pytest]
# Dedicated browser suite. Run from the repository root:
#   uv run --group e2e pytest -c e2e/pytest.ini e2e
# Always pass the `e2e` path: with -c alone pytest collects from the current directory, because
# testpaths applies only when running from the config rootdir.
# The normal `pytest` run (pyproject testpaths) never collects this directory.
DJANGO_SETTINGS_MODULE = config.settings
django_find_project = false
pythonpath = ..
testpaths = e2e
python_files = test_*.py
addopts = --browser chromium --tracing retain-on-failure --screenshot only-on-failure -p no:cacheprovider
markers =
    screenshots: milestone screenshot set; collected only with --screenshots-dir
