{% comment %}Keeps Django's error_class ("errorlist", "errorlist nonfield") so Django admin styles errors; vr-field-errors styles them in the app.{% endcomment %}{% if errors %}<ul class="{{ error_class }}{% if errors.field_id %} vr-field-errors{% else %} mb-0 ps-3{% endif %}"{% if errors.field_id %} id="{{ errors.field_id }}_error"{% endif %}>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
