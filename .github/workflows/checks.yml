name: checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    # The suite renders real PDFs and takes 10 to 20 minutes depending on the runner.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots
          POSTGRES_PASSWORD: roots
          POSTGRES_DB: roots
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - name: Collect static assets for template-serving tests
        run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots
          POSTGRES_PASSWORD: roots
          POSTGRES_DB: roots_browser
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
      - run: uv sync --frozen --group e2e
      - name: Install headless Chromium and system dependencies
        run: uv run --group e2e playwright install --with-deps --only-shell chromium
      - name: Collect assets with strict production manifest storage
        run: uv run --group e2e python manage.py collectstatic --noinput
      - name: Isolated browser journeys (one worker, disposable test database)
        run: uv run --group e2e pytest -c e2e/pytest.ini e2e

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: roots_container_smoke
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots_ci -d roots_container_smoke" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image (no push)
        run: docker build --tag smart-roots-lims:ci .
      - name: Validate the local trial Compose file
        run: docker compose --profile app config --quiet
      - name: Configure disposable smoke environment
        run: |
          cat > "$RUNNER_TEMP/roots-smoke.env" <<'ENV'
          DEBUG=false
          SECRET_KEY=disposable-ci-only-key-never-for-a-real-deployment-2026
          DATABASE_URL=postgresql://roots_ci:disposable_ci_password@127.0.0.1:5432/roots_container_smoke
          ALLOWED_HOSTS=127.0.0.1,localhost
          PORT=8000
          WEB_CONCURRENCY=1
          REPORT_SYNTHETIC_DATA_NOTICE=true
          ENV
      - name: Migrate empty smoke database and verify PDF/statistics runtime
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" smart-roots-lims:ci python manage.py migrate --noinput
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" smart-roots-lims:ci python manage.py check
          docker run --rm --env-file "$RUNNER_TEMP/roots-smoke.env" smart-roots-lims:ci python -c 'from weasyprint import HTML; pdf=HTML(string="<h1>Synthetic container smoke</h1>").write_pdf(); assert pdf.startswith(b"%PDF-")'
          docker run --rm smart-roots-lims:ci python -c 'from scipy.stats import t; assert 3.142 < t.ppf(0.99, 6) < 3.144'
      - name: Run the acceptance scripts inside the image
        run: |
          install -d -m 0777 "$RUNNER_TEMP/acceptance"
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" \
            -v "$RUNNER_TEMP/acceptance:/evidence" smart-roots-lims:ci \
            python manage.py run_acceptance --operator "CI container smoke" --output /evidence/run
          (cd "$RUNNER_TEMP/acceptance/run" && sha256sum --check --quiet manifest-sha256.txt)
      - name: Verify non-root Render SSH prerequisites
        run: |
          docker run --rm smart-roots-lims:ci python -c 'import os, pwd, stat; from pathlib import Path; user=pwd.getpwuid(os.getuid()); home=Path.home(); ssh=home/".ssh"; assert os.getuid()==10001; assert str(home)==user.pw_dir=="/home/app" and os.access(home, os.W_OK); assert user.pw_shell=="/bin/bash" and os.access(user.pw_shell, os.X_OK); assert ssh.is_dir() and ssh.stat().st_uid==os.getuid(); assert stat.S_IMODE(ssh.stat().st_mode)==0o700; assert os.access(ssh, os.W_OK)'
      - name: Start production server and check HTTP endpoints
        run: |
          docker run --detach --name roots-smoke --network host --env-file "$RUNNER_TEMP/roots-smoke.env" smart-roots-lims:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/; then break; fi
            sleep 2
          done
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/assets/site.css --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/accounts/login/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/static/admin/css/base.css --output /dev/null
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs roots-smoke || true
          docker rm -f roots-smoke || true
          rm -f "$RUNNER_TEMP/roots-smoke.env"
