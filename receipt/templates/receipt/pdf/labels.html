<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Laboratory identity labels</title>
  <style>
    @page { size: 4in 2in; margin: 3mm; }
    body { margin: 0; color: #000; font: 8pt / 1.12 "DejaVu Sans", sans-serif; }
    .label { break-after: page; }
    .label:last-child { break-after: auto; }
    .heading { font-size: 10pt; font-weight: bold; overflow-wrap: anywhere; }
    .sample { overflow-wrap: anywhere; }
    .detail { margin: 1mm 0; }
    .barcode { margin-top: 1mm; }
    .barcode svg { display: block; max-width: 100%; height: 11mm; }
    .code { font: 7pt "DejaVu Sans Mono", monospace; }
  </style>
</head>
<body>
{% for row in rows %}
<section class="label">
  <div class="heading">{{ row.label.heading }}</div>
  <div class="sample">Client sample: {{ row.label.sample_id }}</div>
  <div class="detail">{{ row.label.detail }} · Collected {{ row.label.collected }}</div>
  <div class="barcode">{{ row.barcode }}</div>
  <div class="code">{{ row.label.code }}</div>
</section>
{% endfor %}
</body>
</html>
